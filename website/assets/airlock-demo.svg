<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Without Airlock vs. with Airlock</title>
  <desc id="desc">Without Airlock, agents receive real API keys, passwords, and URLs, so secrets enter prompts, logs, and tool output. With Airlock, agents only get a local endpoint and a revocable token; the policy gate injects real credentials after checks, and the SecretStore keeps URLs, passwords, and API keys on the machine.</desc>
  <defs>
    <marker id="arrowBad" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0504d" />
    </marker>
    <marker id="arrowGood" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#267d5f" />
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Without Airlock -->
  <rect x="30" y="48" width="900" height="150" rx="18" fill="#fbf2f1" stroke="#e8c9c7" stroke-width="1" />
  <text x="56" y="76" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a34b46">WITHOUT AIRLOCK</text>

  <rect x="70" y="96" width="150" height="52" rx="12" fill="#ffffff" stroke="#c7b2b0" stroke-width="1.5" />
  <text x="145" y="128" font-size="16" font-weight="600" text-anchor="middle" fill="#18201d">Agent / Script</text>

  <line x1="230" y1="122" x2="690" y2="122" stroke="#c0504d" stroke-width="2.5" marker-end="url(#arrowBad)" />
  <text x="460" y="108" font-size="14" text-anchor="middle" fill="#a34b46">API key · password · real URL</text>

  <rect x="700" y="96" width="190" height="52" rx="12" fill="#ffffff" stroke="#c7b2b0" stroke-width="1.5" />
  <text x="795" y="128" font-size="16" font-weight="600" text-anchor="middle" fill="#18201d">LLM · SSH · HTTP</text>

  <text x="480" y="178" font-size="15" text-anchor="middle" fill="#8c3f3b">Secrets end up in prompts, logs, and tool output.</text>

  <!-- With Airlock -->
  <rect x="30" y="240" width="900" height="270" rx="18" fill="#eff6f2" stroke="#bfdccd" stroke-width="1" />
  <text x="56" y="268" font-size="13" font-weight="700" letter-spacing="1.5" fill="#267d5f">WITH AIRLOCK</text>

  <rect x="70" y="306" width="150" height="52" rx="12" fill="#ffffff" stroke="#b9d6c8" stroke-width="1.5" />
  <text x="145" y="338" font-size="16" font-weight="600" text-anchor="middle" fill="#18201d">Agent / Script</text>

  <line x1="230" y1="332" x2="370" y2="332" stroke="#267d5f" stroke-width="2.5" marker-end="url(#arrowGood)" />
  <text x="300" y="318" font-size="13.5" text-anchor="middle" fill="#1f6b52">127.0.0.1 + revocable token</text>

  <rect x="380" y="286" width="200" height="92" rx="14" fill="#ffffff" stroke="#267d5f" stroke-width="2" />
  <text x="480" y="326" font-size="18" font-weight="700" text-anchor="middle" fill="#18201d">Airlock</text>
  <text x="480" y="348" font-size="11" letter-spacing="2" text-anchor="middle" fill="#5d6b66">POLICY GATE</text>

  <line x1="590" y1="332" x2="690" y2="332" stroke="#267d5f" stroke-width="2.5" marker-end="url(#arrowGood)" />
  <text x="640" y="318" font-size="13.5" text-anchor="middle" fill="#1f6b52">credential injected</text>

  <rect x="700" y="306" width="190" height="52" rx="12" fill="#ffffff" stroke="#b9d6c8" stroke-width="1.5" />
  <text x="795" y="338" font-size="16" font-weight="600" text-anchor="middle" fill="#18201d">LLM · SSH · HTTP</text>

  <line x1="480" y1="378" x2="480" y2="400" stroke="#267d5f" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="380" y="406" width="200" height="48" rx="12" fill="#e7f1ec" stroke="#9cc4b1" stroke-width="1.5" />
  <text x="480" y="428" font-size="14" font-weight="700" text-anchor="middle" fill="#267d5f">SecretStore</text>
  <text x="480" y="446" font-size="11.5" text-anchor="middle" fill="#4a6b5e">URLs · passwords · API keys</text>

  <text x="480" y="478" font-size="15" text-anchor="middle" fill="#1f6b52">Real credentials never leave your machine — revoke one route, not your account.</text>
</svg>
