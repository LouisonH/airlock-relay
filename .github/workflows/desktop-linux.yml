name: Desktop Linux installer

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "apps/desktop/**"
      - "scripts/build-sidecar.mjs"
      - ".github/workflows/desktop-linux.yml"

permissions:
  contents: read

jobs:
  installer:
    name: Build Linux installer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Tauri sidecar
        shell: bash
        env:
          AIRLOCK_OUTPUT_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/binaries
        run: node scripts/build-sidecar.mjs ${{ matrix.target }}
      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.triple }} --bundles deb,appimage
      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p .verify/installer-${{ matrix.target }}
          find apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} .verify/installer-${{ matrix.target }}/ \;
      - uses: actions/upload-artifact@v5
        with:
          name: airlock-linux-${{ matrix.target }}
          path: .verify/installer-${{ matrix.target }}/
          if-no-files-found: error
