name: Desktop Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "apps/desktop/**"
      - "scripts/build-sidecar.mjs"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  installer:
    name: Build Windows installer (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            triple: x86_64-pc-windows-msvc
          - target: windows-arm64
            triple: aarch64-pc-windows-msvc
          - target: windows-386
            triple: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, i686-pc-windows-msvc
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Tauri sidecars (all Windows architectures)
        shell: bash
        env:
          AIRLOCK_OUTPUT_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/binaries
        run: |
          node scripts/build-sidecar.mjs windows-amd64
          node scripts/build-sidecar.mjs windows-arm64
          node scripts/build-sidecar.mjs windows-386
      - name: Smoke test Windows sidecar startup and named-pipe control
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $sidecar = (Resolve-Path "apps/desktop/src-tauri/binaries/airlockd-x86_64-pc-windows-msvc.exe").Path
          $cli = (Resolve-Path "apps/desktop/src-tauri/binaries/airlock-x86_64-pc-windows-msvc.exe").Path
          $controlDirectory = Join-Path $env:RUNNER_TEMP "airlock-core-smoke"
          $tokenPath = Join-Path $controlDirectory "control.token"
          New-Item -ItemType Directory -Force -Path $controlDirectory | Out-Null
          & $cli token generate --output $tokenPath
          if ($LASTEXITCODE -ne 0) { throw "airlock CLI could not create a protected control token" }
          $token = (Get-Content -Raw -LiteralPath $tokenPath).Trim()
          if ($token.Length -lt 32) { throw "generated control token was unexpectedly short" }
          function Get-FreeTcpPort {
            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            try { return ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port }
            finally { $listener.Stop() }
          }
          $httpPort = Get-FreeTcpPort
          $sshPort = Get-FreeTcpPort
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $sidecar
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @("--control-token-stdin", "--control-dir", $controlDirectory, "--listen", "127.0.0.1:$httpPort", "--ssh-listen", "127.0.0.1:$sshPort", "--secret-store", "local_file")) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          try {
            $process.StandardInput.WriteLine($token)
            $process.StandardInput.Close()
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              if ($process.HasExited) {
                $stderr = $process.StandardError.ReadToEnd()
                throw "airlockd exited during initial startup: $stderr"
              }
              if (Test-NetConnection -ComputerName "127.0.0.1" -Port $httpPort -InformationLevel Quiet) {
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-NetConnection -ComputerName "127.0.0.1" -Port $httpPort -InformationLevel Quiet)) {
              throw "airlockd did not open the HTTP listener"
            }
            $statusOutput = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $statusOutput = & $cli --data-dir $controlDirectory --token-file $tokenPath --timeout 2s status 2>&1
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($LASTEXITCODE -ne 0) {
              throw "airlock CLI could not reach the Windows named-pipe control channel: $statusOutput"
            }
            if (($statusOutput -join "`n") -notmatch '"running"\s*:\s*true') {
              throw "airlock control status was not running: $statusOutput"
            }
          } finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $controlDirectory
          }
      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.triple }}
      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p .verify/installer-${{ matrix.target }}
          find apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} .verify/installer-${{ matrix.target }}/ \;
      - uses: actions/upload-artifact@v5
        with:
          name: airlock-windows-${{ matrix.target }}
          path: .verify/installer-${{ matrix.target }}/
          if-no-files-found: error
