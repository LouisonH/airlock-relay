name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...

  cross-compile-core:
    name: Core cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            goos: windows
            goarch: amd64
            extension: .exe
          - target: windows-arm64
            goos: windows
            goarch: arm64
            extension: .exe
          - target: linux-x64
            goos: linux
            goarch: amd64
            extension: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            extension: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            extension: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build core and CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p .verify/${{ matrix.target }}
          go build -buildvcs=false -trimpath -o .verify/${{ matrix.target }}/airlockd${{ matrix.extension }} ./cmd/airlockd
          go build -buildvcs=false -trimpath -o .verify/${{ matrix.target }}/airlock${{ matrix.extension }} ./cmd/airlock

  desktop:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  package-and-site:
    name: Installer source and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test installer source
        working-directory: packages/airlock
        run: |
          npm run test:source
      - name: Check static site scripts
        run: |
          node --check website/assets/site.js
          node --check website/assets/docs-guides.js
          node --check website/assets/docs.js
