[package]
name = "airlock-desktop"
version = "0.1.2"
description = "Native control plane for the Airlock local relay"
authors = ["LouisonH"]
edition = "2021"

[lib]
name = "airlock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
